services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - AUTOPARTSPLUS_BASE_URL=${AUTOPARTSPLUS_BASE_URL}
      - REPUESTOSMAX_BASE_URL=${REPUESTOSMAX_BASE_URL}
      - GLOBALPARTS_BASE_URL=${GLOBALPARTS_BASE_URL}
      - PARTS_REFRESH_CRON=${PARTS_REFRESH_CRON:-0 */15 * * * *}
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
